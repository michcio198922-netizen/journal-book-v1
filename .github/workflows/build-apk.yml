name: Build Mapa Książki APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Ustaw Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4

      - name: Zainstaluj Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Sprawdź sekrety podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOKMAP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOOKMAP_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Brakuje BOOKMAP_KEYSTORE_BASE64 lub BOOKMAP_KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Ustaw numer wersji
        run: |
          echo "BUILD_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Zainstaluj zależności
        run: npm install

      - name: Wygeneruj Android
        env:
          BOOKMAP_KEYSTORE_PASSWORD: ${{ secrets.BOOKMAP_KEYSTORE_PASSWORD }}
        run: npx expo prebuild --platform android --clean

      - name: Odtwórz klucz podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOKMAP_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/bookmap-release.jks

      - name: Zbuduj release APK
        env:
          BOOKMAP_KEYSTORE_PASSWORD: ${{ secrets.BOOKMAP_KEYSTORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-Ksiazki-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
